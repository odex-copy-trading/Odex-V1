global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: whal-engine
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: whal-engine

  - job_name: whal-control-plane
    metrics_path: /api/health
    static_configs:
      - targets: ["api:8787"]
        labels:
          service: whal-api
