[package]
name = "whal-config"
version = "0.1.0"
edition = "2021"
description = "Typed configuration, validation, encrypted secret store and hot reload for the Whal Bot engine."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arc-swap = "1"
notify = "7"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
bs58 = "0.5"
url = "2"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
