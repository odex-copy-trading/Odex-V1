[package]
name = "whal-engine"
version = "0.1.0"
edition = "2021"
description = "High-speed Solana ShredStream/Geyser ingestion, signal engine, and execution core for Whal Bot."
publish = false

[workspace]
members = [".", "whal-config"]

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
whal-config = { path = "whal-config" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
dashmap = "6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
prost = "0.13"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
solana-entry = { version = "4.3", features = ["agave-unstable-api"] }
wincode = "0.6"
tikv-jemallocator = { version = "0.6", optional = true }
